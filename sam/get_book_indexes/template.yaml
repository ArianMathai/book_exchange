AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Unified get_book_indexes template for all environments'

Globals:
  Function:
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, dev, prod]
    Description: The deployment environment

  CognitoUserPoolId:
    Type: String
    Description: The ID of the Cognito User Pool for this environment
    # Provided via parameter overrides (script or samconfig)

Conditions:
  IsSandbox: !Equals [!Ref Environment, sandbox]
  IsDev:     !Equals [!Ref Environment, dev]
  IsProd:    !Equals [!Ref Environment, prod]

Resources:
  GetBooksApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !If
        - IsProd
        - Prod
        - !If
          - IsDev
          - Dev
          - Sandbox
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !If
          - IsProd
          - "'https://main.d2nd4m61c5fnyt.amplifyapp.com'"
          - "'*'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  GetBooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_book_indexes/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          SECRET_NAME: !If
            - IsProd
            - "NeonDatabaseUrlProd"
            - "NeonDatabaseUrlDev"
          REGION: "eu-north-1"
          ENVIRONMENT: !Ref Environment
      Events:
        GetBooks:
          Type: Api
          Properties:
            RestApiId: !Ref GetBooksApi
            Path: /books/search
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        GetBooksOptions:
          Type: Api
          Properties:
            RestApiId: !Ref GetBooksApi
            Path: /books/search
            Method: options
            Auth:
              Authorizer: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - IsProd
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:NeonDatabaseUrlProd-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:NeonDatabaseUrlDev-*"

  UnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: UNAUTHORIZED
      RestApiId: !Ref GetBooksApi
      StatusCode: 401
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !If
          - IsProd
          - "'https://main.d2nd4m61c5fnyt.amplifyapp.com'"
          - "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"

  Default4xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref GetBooksApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !If
          - IsProd
          - "'https://main.d2nd4m61c5fnyt.amplifyapp.com'"
          - "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"

  Default5xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref GetBooksApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !If
          - IsProd
          - "'https://main.d2nd4m61c5fnyt.amplifyapp.com'"
          - "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"

Outputs:
  GetBooksApi:
    Description: !Sub "API Gateway endpoint URL for ${Environment} stage for Get Books"
    Value: !Sub "https://${GetBooksApi}.execute-api.${AWS::Region}.amazonaws.com/${GetBooksApi.Stage}/books/search"
  GetBooksFunction:
    Description: Get Books Lambda Function ARN
    Value: !GetAtt GetBooksFunction.Arn
  GetBooksFunctionIamRole:
    Description: Implicit IAM Role created for GetBooksFunction
    Value: !GetAtt GetBooksFunctionRole.Arn
  Environment:
    Description: The deployed environment
    Value: !Ref Environment
