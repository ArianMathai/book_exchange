AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  upsert_user_location_prod

Globals:
  Function:
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON

Parameters:
  CognitoUserPoolId:
    Type: String
    Description: The ID of the existing Cognito User Pool from Amplify
    Default: "eu-north-1_ncYQOqnAD"

Resources:
  UpsertUserLocationApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  UpsertUserLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: upsert_user_location_prod/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          SECRET_NAME: "NeonDatabaseUrlProd"
          REGION: "eu-north-1"
      Events:
        UpsertUserLocation:
          Type: Api
          Properties:
            RestApiId: !Ref UpsertUserLocationApi
            Path: /user/location
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        UpsertUserLocationOptions:
          Type: Api
          Properties:
            RestApiId: !Ref UpsertUserLocationApi
            Path: /user/location
            Method: options
            Auth:
              Authorizer: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:NeonDatabaseUrlProd-*"

Outputs:
  UpsertUserLocationApi:
    Description: API Gateway endpoint URL for Prod stage for Upsert User Location function
    Value: !Sub "https://${UpsertUserLocationApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/user/location/"
  UpsertUserLocationFunction:
    Description: Upsert User Location Lambda Function ARN
    Value: !GetAtt UpsertUserLocationFunction.Arn
  UpsertUserLocationFunctionIamRole:
    Description: Implicit IAM Role created for Upsert User Location function
    Value: !GetAtt UpsertUserLocationFunctionRole.Arn